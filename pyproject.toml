[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexible-arm-sdk"
version = "0.1.0"
description = "Python SDK for a custom FashionStar servo arm"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "fashionstar-uart-sdk>=1.0.0",
    "pyqt6>=6.11.0",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.0.0", "keyboard>=0.13.5"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["flexible_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
