controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - base
      - shoulder
      - elbow
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
